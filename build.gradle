plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

def normalizeVersion(raw) {
    if (!raw) return null
    def s = raw.toString().trim()
    if (s.startsWith('refs/tags/')) s = s.substring(10).trim()
    if (s.toLowerCase().startsWith('v')) s = s.substring(1).trim()
    return s ?: null
}

def resolveProjectVersion() {
    def v = providers.gradleProperty('releaseVersion')
            .orElse(providers.environmentVariable('RELEASE_VERSION'))
            .orElse(providers.environmentVariable('GITHUB_REF'))
            .orNull

    if (v) {
        def norm = normalizeVersion(v)
        if (norm) return norm
    }

    def manifestFile = layout.projectDirectory.file('.release-please-manifest.json').asFile
    if (manifestFile.exists()) {
        def text = manifestFile.text
        def matcher = (text =~ /"\.":\s*"([^"]+)"/)
        if (matcher.find()) {
            return matcher.group(1).trim()
        }
    }
    return '0.0.0-SNAPSHOT'
}

group = 'com.ars3ne.eventos'
version = resolveProjectVersion()

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'spigotmc-public'
        url = 'https://hub.spigotmc.org/nexus/content/groups/public/'
    }
    maven {
        name = 'spigotmc-snapshots'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'roinujnosde'
        url = 'https://repo.roinujnosde.me/releases/'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = 'iridiumdevelopment'
        url = 'https://nexus.iridiumdevelopment.net/repository/maven-releases/'
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot:1.8.8-R0.1-SNAPSHOT'
    compileOnly 'net.sacredlabyrinth.phaed.simpleclans:SimpleClans:2.16.2'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // bungeecord-api, Factions, MassiveCore e LegendChat nao tem mais repositorio publico vivo
    // (ci.2lstudios.dev e nexus.savagelabs.net estao mortos) -- jars vendorizados em libs/,
    // copiados dos mesmos jars ja usados por paragonn-core/paragonn-system.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'com.github.HenryFabio:inventory-api:2.0.3'
    implementation 'com.github.cryptomorin:XSeries:8.7.0'
    implementation 'com.iridium:IridiumColorAPI:1.0.11'
    implementation 'com.zaxxer:HikariCP:4.0.3'
}

def targetJavaVersion = 8
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveVersion.set('')
    archiveClassifier.set('')
    archiveFileName.set("${rootProject.name}.jar")

    mergeServiceFiles()

    relocate 'com.cryptomorin.xseries', 'com.ars3ne.eventos.shaded.xseries'
    relocate 'com.henryfabio.minecraft.inventoryapi', 'com.ars3ne.eventos.shaded.inventoryapi'
    relocate 'com.iridium.iridiumcolorapi', 'com.ars3ne.eventos.shaded.iridiumcolorapi'
    relocate 'com.zaxxer.hikari', 'com.ars3ne.eventos.shaded.hikari'
    relocate 'org.slf4j', 'com.ars3ne.eventos.shaded.slf4j'
}

tasks.named('assemble') {
    dependsOn tasks.shadowJar
}

tasks.named('jar') {
    enabled = false
}

tasks.register('deployPlugin', Copy) {
    dependsOn tasks.shadowJar
    from(tasks.shadowJar.archiveFile)
    into(file('D:/paragonn.com.br/paragonn-server/plugins'))
}

tasks.named('assemble') {
    finalizedBy('deployPlugin')
}
